rutina_fija:
  desayuno: >
    Café con leche. Pan integral (100% integral, mejor de buena
    panadería: centeno, trigo sarraceno o espelta). Aceite de oliva
    virgen extra (prensado en frío si es posible). Variantes: con
    tomate y AOVE / con queso fresco, orégano y AOVE / con pechuga de
    pavo, jamón cocido (buena calidad, sin aditivos, conservantes,
    gluten ni lactosa) o jamón ibérico.
  media_manana: >
    Yogur bajo en azúcar (5-7%). Nueces, almendras o avellanas
    tostadas sin sal. Pieza de fruta (manzana, pera, o frutos del
    bosque: arándanos, frambuesas, fresas o moras).
  media_tarde: >
    Dos rollitos de jamón o pechuga de pavo con queso tierno, o dos
    lonchas de salmón ahumado, o dos rollitos de salmón ahumado con
    aguacate. Frutos secos (un puño). NO FRUTA.
  nota_cena: >
    En las cremas: reduce el aceite a unos 20-25g, sin mantequilla —
    puedes añadir un poco de nata o un par de quesitos. NO FRUTA en
    la cena.

